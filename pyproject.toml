[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mm-collection"
version = "0.1.1"
description = "A local catalogue for an M&M collection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "jinja2>=3.1,<4",
    "pillow>=11,<13",
    "pillow-heif>=0.20,<2",
    "python-multipart>=0.0.18,<1",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mm_collection"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
