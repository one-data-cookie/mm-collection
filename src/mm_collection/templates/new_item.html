<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add an object · M&amp;M Collection</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}">
  </head>
  <body>
    <header class="site-header">
      <a class="wordmark" href="{{ url_for('index') }}">M&amp;M Collection</a>
      <a class="quiet-link" href="{{ url_for('index') }}">Cancel</a>
    </header>
    <main class="page page--narrow">
      <div class="page-heading">
        <p class="eyebrow">New acquisition</p>
        <h1>Add an object</h1>
        <p>Start with the essentials. Everything except the title is optional.</p>
      </div>

      {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}

      <form method="post" enctype="multipart/form-data" class="object-form">
        <label>
          <span>Title <strong>Required</strong></span>
          <input name="title" value="{{ values.get('title', '') }}" required autofocus>
        </label>

        <label>
          <span>Photographs</span>
          <input type="file" name="photos" accept="image/*" multiple>
          <small>Select or take several photographs at once.</small>
        </label>

        <div class="form-grid">
          <label>
            <span>Author or maker</span>
            <input name="author" value="{{ values.get('author', '') }}">
          </label>
          <label>
            <span>Object type</span>
            <input name="type" value="{{ values.get('type', '') }}">
          </label>
          <label>
            <span>Date created</span>
            <input name="date_created" value="{{ values.get('date_created', '') }}">
          </label>
          <label>
            <span>Date acquired</span>
            <input type="date" name="date_acquired" value="{{ values.get('date_acquired', '') }}">
          </label>
          <label>
            <span>Seller</span>
            <input name="seller" value="{{ values.get('seller', '') }}">
          </label>
          <label>
            <span>Price</span>
            <input name="price" value="{{ values.get('price', '') }}" inputmode="decimal">
          </label>
        </div>

        <label>
          <span>Story</span>
          <textarea name="story" rows="6">{{ values.get('story', '') }}</textarea>
        </label>

        <button class="button button--submit" type="submit">Save object</button>
      </form>
    </main>
  </body>
</html>
